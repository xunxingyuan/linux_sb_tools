<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LINUX SB 扩展工具箱设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="options">
      <h1>LINUX SB 扩展工具箱</h1>
      <p class="intro">设置个人积分抽取的安全提醒，以及发帖时使用的可选图床。</p>
      <form id="settingsForm">
        <label class="field">
          <span>最低保留积分</span>
          <input id="reservePoints" type="number" min="0" step="1" value="0">
          <small>抽取前如果余额会低于此数值，插件会阻止提交。</small>
        </label>
        <label class="check-field">
          <input id="confirmEachDraw" type="checkbox" checked>
          <span>每次抽取前显示确认提示</span>
        </label>
        <div class="button-row">
          <button class="primary" type="submit">保存设置</button>
          <button id="clearHistory" type="button">清除本地统计</button>
        </div>
        <div id="message" class="message" aria-live="polite"></div>
      </form>

      <section class="settings-card">
        <div class="card-heading">
          <div>
            <h2>图床助手</h2>
            <p>默认关闭；开启后只在发帖或回帖页出现。</p>
          </div>
          <span class="default-badge">默认关闭</span>
        </div>
        <form id="imageHostForm">
          <label class="check-field image-toggle-field">
            <input id="imageHostEnabled" type="checkbox">
            <span>启用 Cloudflare R2 图片上传</span>
          </label>
          <label class="field">
            <span>图床类型</span>
            <select id="imageProvider">
              <option value="cloudflare-r2">Cloudflare R2（公开直链）</option>
            </select>
            <small>图片会上传到第三方公共图床，返回的链接可直接用于论坛 Markdown。</small>
          </label>
          <label class="field">
            <span>Cloudflare 账户 ID</span>
            <input id="cloudflareAccountId" type="text" autocomplete="off" spellcheck="false" placeholder="填写 Cloudflare Account ID">
            <small>在 Cloudflare 控制台的账户概览中可以找到。</small>
          </label>
          <label class="field">
            <span>R2 Bucket 名称</span>
            <input id="cloudflareBucket" type="text" autocomplete="off" spellcheck="false" placeholder="填写 R2 Bucket 名称">
            <small>填写要保存图片的 R2 Bucket。</small>
          </label>
          <label class="field">
            <span>R2 Access Key ID</span>
            <input id="cloudflareAccessKeyId" type="text" autocomplete="off" spellcheck="false" placeholder="填写 R2 Access Key ID">
          </label>
          <label class="field">
            <span>R2 Secret Access Key</span>
            <input id="cloudflareSecretAccessKey" type="password" autocomplete="off" spellcheck="false" placeholder="填写 R2 Secret Access Key">
          </label>
          <label class="field">
            <span>图片公开访问地址</span>
            <input id="cloudflarePublicBaseUrl" type="url" autocomplete="off" spellcheck="false" placeholder="例如：https://img.example.com 或 https://pub-xxx.r2.dev">
            <small>需要已绑定到 Bucket 的自定义域名或 R2 公网地址。</small>
          </label>
          <label class="field">
            <span>对象前缀（可选）</span>
            <input id="cloudflareObjectPrefix" type="text" autocomplete="off" spellcheck="false" value="linux-sb" placeholder="linux-sb">
          </label>
          <div class="image-compression-settings">
            <div class="compression-title">上传优化</div>
            <label class="check-field image-toggle-field">
              <input id="imageCompressionEnabled" type="checkbox" checked>
              <span>上传前压缩图片（推荐）</span>
            </label>
            <label class="field compact-field">
              <span>压缩质量</span>
              <select id="imageCompressionQuality">
                <option value="0.8">80% · 更省空间</option>
                <option value="0.84" selected>84% · 推荐</option>
                <option value="0.9">90% · 更清晰</option>
              </select>
            </label>
            <label class="field compact-field">
              <span>最长边上限</span>
              <input id="imageMaxDimension" type="number" min="512" max="8192" step="1" value="2560">
              <small>JPG、PNG、WebP 会转换为 WebP；GIF 动图和 SVG 保留原格式。</small>
            </label>
          </div>
          <div class="image-host-note">
            图片会以公开链接形式访问。压缩在浏览器本地完成，只有压缩后的图片才会上传；如果压缩结果反而变大，则自动保留原图。Access Key 和 Secret Access Key 属于敏感凭据，只保存在本地扩展设置中；不要在聊天中发送，也不要上传隐私图片。
          </div>
          <div class="button-row">
            <button class="primary" type="submit">保存图床设置</button>
            <button id="disableImageHost" type="button">关闭图床</button>
          </div>
          <button id="clearImageCredentials" class="secondary-button" type="button">清除 Cloudflare R2 凭据</button>
          <div id="imageHostMessage" class="message" aria-live="polite"></div>
        </form>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
