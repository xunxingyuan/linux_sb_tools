<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LINUX SB 扩展工具箱设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="options">
      <h1>LINUX SB 扩展工具箱</h1>
      <p class="intro">设置积分抽取提醒和称号市场价格提醒。</p>
      <form id="settingsForm">
        <label class="field">
          <span>最低保留积分</span>
          <input id="reservePoints" type="number" min="0" step="1" value="0">
          <small>抽取前如果余额会低于此数值，插件会阻止提交。</small>
        </label>
        <label class="check-field">
          <input id="confirmEachDraw" type="checkbox" checked>
          <span>每次抽取前显示确认提示</span>
        </label>
        <p id="accountLabel" class="account-label"></p>
        <div class="button-row">
          <button class="primary" type="submit">保存设置</button>
          <button id="clearHistory" type="button" disabled>清除该账号统计</button>
        </div>
        <div id="message" class="message" aria-live="polite"></div>
      </form>

      <section class="settings-card" aria-labelledby="marketHeading">
        <h2 id="marketHeading">称号市场价格提醒</h2>
        <p class="market-help">按称号名称和最高单价监控在售交易。命中后显示桌面通知，点击通知打开市场，由你确认购买。检查在后台进行，无需保持市场页面打开。</p>
        <form id="marketWatchForm">
          <label class="check-field">
            <input id="marketEnabled" type="checkbox">
            <span>启用价格监控</span>
          </label>
          <label class="field">
            <span>检查间隔</span>
            <select id="marketInterval">
              <option value="5">每 5 分钟</option>
              <option value="10">每 10 分钟</option>
              <option value="30">每 30 分钟</option>
              <option value="60">每 60 分钟</option>
            </select>
          </label>
          <div id="marketRules" class="market-rules" aria-label="价格规则"></div>
          <button id="addMarketRule" type="button">添加称号</button>
          <div class="button-row market-actions">
            <button class="primary" type="submit">保存监控</button>
            <button id="marketCheckNow" type="button">立即检查</button>
            <a class="market-link" href="https://linux.sb/gacha_market" target="_blank" rel="noopener">打开市场</a>
          </div>
          <div id="marketMessage" class="message" aria-live="polite"></div>
          <p id="marketStatus" class="market-status"></p>
        </form>
      </section>
    </main>
    <script src="lib/state.js"></script>
    <script src="options.js"></script>
  </body>
</html>
