<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LINUX SB 扩展工具箱</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div>
          <div class="popup-title">🧰 LINUX SB 扩展工具箱</div>
          <div class="popup-subtitle">称号 · 熔铸 · 图床</div>
        </div>
        <span class="local-badge">本地</span>
      </header>

      <section id="status" class="status" aria-live="polite">正在读取…</section>

      <section class="metric-grid" aria-label="称号概况">
        <div class="metric"><span>当前积分</span><strong id="points">—</strong></div>
        <div class="metric"><span>收集进度</span><strong id="collection">—</strong></div>
        <div class="metric"><span>累计抽取</span><strong id="pulls">—</strong></div>
        <div class="metric"><span>累计投入</span><strong id="spend">—</strong></div>
      </section>

      <section class="page-actions" aria-label="快捷操作">
        <button id="refresh" class="primary refresh-button">更新数据</button>
        <div class="page-grid">
          <button id="openGacha">称号抽取</button>
          <button id="openForge">熔铸助手</button>
          <button id="openProfile">我的称号</button>
        </div>
      </section>
      <div class="utility-row">
        <label class="toggle-row" for="adRemovalEnabled">
          <input id="adRemovalEnabled" type="checkbox">
          <span>隐藏右侧广告</span>
        </label>
        <button id="openOptions" class="text-button">更多设置</button>
      </div>
    </main>
    <script src="lib/state.js"></script>
    <script src="lib/parser.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
