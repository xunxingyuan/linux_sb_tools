<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LINUX SB 扩展工具箱</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div>
          <div class="popup-title">🧰 LINUX SB 扩展工具箱</div>
          <div class="popup-subtitle">称号统计 · 熔铸助手 · 市场提醒</div>
        </div>
        <span class="local-badge">本地</span>
      </header>

      <section id="status" class="status" aria-live="polite">正在读取…</section>

      <section class="metric-grid" aria-label="称号概况">
        <div class="metric"><span>当前积分</span><strong id="points">—</strong></div>
        <div class="metric"><span>收集进度</span><strong id="collection">—</strong></div>
        <div class="metric"><span>累计抽取</span><strong id="pulls">—</strong></div>
        <div class="metric"><span>累计投入</span><strong id="spend">—</strong></div>
      </section>

      <section class="market-monitor" aria-labelledby="marketMonitorTitle">
        <div class="market-monitor-header">
          <strong id="marketMonitorTitle">市场监控</strong>
          <span id="marketBadge" class="market-badge">读取中</span>
        </div>
        <p id="marketSummary" class="market-summary">正在读取监控规则…</p>
        <ul id="marketRules" class="market-rule-list" aria-label="监控的称号"></ul>
        <div class="market-monitor-footer">
          <span id="marketLastCheck">尚未检查</span>
          <button id="manageMarket" type="button" class="text-button">管理规则</button>
        </div>
      </section>

      <section class="page-actions" aria-label="快捷操作">
        <button id="refresh" class="primary refresh-button">更新数据</button>
        <div class="page-grid">
          <button id="openGacha">称号抽取</button>
          <button id="openForge">熔铸助手</button>
          <button id="openProfile">我的称号</button>
          <button id="openMarket">称号市场</button>
        </div>
      </section>
      <div class="utility-row">
        <button id="openOptions" class="text-button">更多设置</button>
      </div>
    </main>
    <script src="lib/state.js"></script>
    <script src="lib/parser.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
